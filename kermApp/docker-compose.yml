services:
  app:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      # Kept inside the storage volume so the image's database/ directory
      # (migrations, seeders, factories) is never shadowed by a volume.
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
    ports:
      - "8000:8000"
    volumes:
      - app_storage:/var/www/html/storage
    networks:
      - app-network

  queue:
    build:
      context: .
    entrypoint: ["worker-entrypoint.sh"]
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - app-network

  scheduler:
    build:
      context: .
    entrypoint: ["worker-entrypoint.sh"]
    command: ["sh", "-c", "while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_DATABASE: /var/www/html/storage/app/database.sqlite
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app_storage:
